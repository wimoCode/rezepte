name: Index erzeugen
on:
  push:
    paths:
      - 'rezepte/**/*.md'
      - 'rezepte/kategorien.json'
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_index.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add rezepte/index.json
          git diff --cached --quiet || git commit -m "Index aktualisiert"
          git push

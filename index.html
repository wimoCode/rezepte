<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rezepte</title>
<meta name="description" content="Unsere Rezeptsammlung: Backen und Kochen.">
<meta name="theme-color" content="#f2f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151b18" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rezepte">
<style>
:root {
  --paper: #f2f4f0;
  --ink: #1e2b27;
  --muted: #5a6962;
  --line: #d5dbd4;
  --chip: #e5eae3;
  --backen: #a8761e;
  --kochen: #2e6f5e;
  --accent: #2b5546;
  --on-accent: #f2f4f0;
  --focus: #1f5fbf;
  --serif: Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151b18;
    --ink: #e7ece8;
    --muted: #9aa8a0;
    --line: #2b3631;
    --chip: #232d28;
    --backen: #d9a54a;
    --kochen: #6fbfa6;
    --accent: #8fd0b9;
    --on-accent: #151b18;
    --focus: #8ab4f8;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 17px/1.55 var(--sans);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.wrap { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

/* Kopf */
.kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: .5rem 0 1rem; }
.kopf h1 { font: 600 2.4rem/1.1 var(--serif); letter-spacing: -.01em; margin: 0; }
.kopf h1 a { text-decoration: none; }
.anzahl { color: var(--muted); font-size: .95rem; }

/* Suche */
.suche { width: 100%; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: .7rem .9rem; margin-bottom: 1.25rem; }
.suche::placeholder { color: var(--muted); }

/* Kacheln */
.gruppe { margin: 0 0 1.75rem; }
.gruppe h2 { font: 600 1.45rem/1.25 var(--serif); margin: 0 0 .7rem; display: flex; align-items: center; gap: .55rem; }
.gruppe h2 i { width: .7rem; height: .7rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.gruppe.backen { --farbe: var(--backen); }
.gruppe.kochen { --farbe: var(--kochen); }
.gruppe h2 i { background: var(--farbe, var(--accent)); }
.kacheln { display: grid; grid-template-columns: repeat(2, 1fr); gap: .7rem; }
@media (min-width: 34rem) { .kacheln { grid-template-columns: repeat(3, 1fr); } }
.kachel {
  display: flex; flex-direction: column; align-items: flex-start; gap: .55rem;
  min-height: 8.6rem; padding: 1rem; text-decoration: none;
  border: 1px solid var(--line); border-radius: 14px;
}
.kachel:hover, .kachel:active { background: var(--chip); }
.kachel svg { width: 2.9rem; height: 2.9rem; color: var(--farbe, var(--accent)); flex: none; }
.kachel .name { font: 600 1.1rem/1.25 var(--serif); }
.kachel .zahl { color: var(--muted); font-size: .85rem; margin-top: auto; }
.kachel.noch-leer { border-style: dashed; }
.kachel.noch-leer svg { opacity: .55; }

/* Liste */
.titelzeile { margin: 0 0 1rem; }
.titelzeile h1 { font: 600 2.1rem/1.15 var(--serif); letter-spacing: -.01em; margin: 0; }
.titelzeile .pfad { display: flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .92rem; margin-bottom: .3rem; }
.pfad i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--muted); display: inline-block; }
.pfad i.backen { background: var(--backen); }
.pfad i.kochen { background: var(--kochen); }
.liste { list-style: none; margin: 1rem 0 0; padding: 0; border-top: 1px solid var(--line); }
.liste li { border-bottom: 1px solid var(--line); }
.zeile {
  display: grid; grid-template-columns: .35rem 1fr; gap: .9rem; text-decoration: none;
  padding: .95rem 0; align-items: stretch;
}
.zeile .marke { border-radius: 2px; background: var(--muted); }
.zeile .marke.backen { background: var(--backen); }
.zeile .marke.kochen { background: var(--kochen); }
.zeile h2 { font: 600 1.3rem/1.25 var(--serif); margin: 0; }
.zeile .sub { color: var(--muted); margin: .1rem 0 0; font-size: .95rem; }
.zeile .meta { color: var(--muted); font-size: .88rem; margin-top: .35rem; }
.leer { color: var(--muted); padding: 1.5rem 0; }

/* Chips */
.chip {
  flex: none; border: 0; background: var(--chip); border-radius: 999px;
  padding: .35rem .8rem; font-size: .92rem; cursor: pointer; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chip.tag::before { content: "#"; opacity: .6; margin-right: .1rem; }

/* Rezept */
.zurueck { display: inline-block; margin: .25rem 0 1rem; padding: .4rem 0; color: var(--muted); text-decoration: none; }
.zurueck:hover { color: var(--ink); }
.rezept h1 { font: 600 2.1rem/1.15 var(--serif); letter-spacing: -.01em; margin: 0 0 .25rem; }
.rezept .sub { color: var(--muted); font-size: 1.05rem; margin: 0 0 1rem; }
.rezept .pfad { display: flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .92rem; margin-bottom: .6rem; }
.daten { display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; margin: 0 0 1rem; padding: .8rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.daten div { min-width: 6rem; }
.daten dt { color: var(--muted); font-size: .85rem; }
.daten dd { margin: 0; font-weight: 600; }
.werkzeuge { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1.25rem; align-items: center; }
.werkzeuge .chip { padding: .5rem .9rem; }
.tags { display: flex; flex-wrap: wrap; gap: .4rem; }
.mengen { display: inline-flex; gap: .4rem; }
.quelle { color: var(--muted); font-size: .9rem; margin: 2rem 0 0; padding-top: .8rem; border-top: 1px solid var(--line); }

.text h2 { font: 600 1.45rem/1.25 var(--serif); margin: 2rem 0 .6rem; }
.text h3 { font: 600 1.05rem/1.3 var(--sans); margin: 1.2rem 0 .4rem; }
.text p { margin: 0 0 1rem; max-width: 38rem; }
.text ul, .text ol { padding-left: 1.3rem; margin: 0 0 1rem; max-width: 38rem; }
.text li { margin: .4rem 0; padding-left: .2rem; }
.text .zutaten li { list-style: none; margin-left: -1.3rem; padding: .45rem .5rem .45rem 2.2rem; position: relative; cursor: pointer; border-bottom: 1px solid var(--line); }
.text .zutaten li::before {
  content: ""; position: absolute; left: .4rem; top: .75rem; width: 1.05rem; height: 1.05rem;
  border: 2px solid var(--muted); border-radius: 4px;
}
.text .zutaten li.fertig { color: var(--muted); text-decoration: line-through; }
.text .zutaten li.fertig::before { background: var(--accent); border-color: var(--accent); }
.tabelle { overflow-x: auto; margin: 0 0 1.25rem; }
.text table { border-collapse: collapse; width: 100%; font-size: .98rem; }
.text th { text-align: left; font-weight: 600; color: var(--muted); font-size: .88rem; border-bottom: 2px solid var(--line); padding: .45rem .6rem .45rem 0; }
.text td { border-bottom: 1px solid var(--line); padding: .6rem .6rem .6rem 0; vertical-align: top; }
.text td:first-child { font-weight: 600; white-space: nowrap; padding-right: 1rem; }
@media (max-width: 30rem) { .text td:first-child { white-space: normal; min-width: 5.5rem; } }
.fehler { border: 1px solid var(--line); border-radius: 10px; padding: 1rem; }
@media print {
  .zurueck, .werkzeuge, .tags { display: none; }
  body { background: #fff; color: #000; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="kopf">
    <h1><a href="#/">Rezepte</a></h1>
    <span class="anzahl" id="anzahl"></span>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<noscript><p class="wrap">Diese Seite braucht JavaScript.</p></noscript>

<script>
(function () {
  'use strict';

  var app = document.getElementById('app');
  var anzahl = document.getElementById('anzahl');
  var DATA = null;
  var wakeLock = null;
  var skal = null;

  // ---------- Icons (Linien-Symbole, 48x48) ----------
  var ICONS = {
    'brot': '<path d="M6 32c0-10 8-18 18-18s18 8 18 18v4a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M16 22l5 9M24 20l5 11M32 22l5 9"/>',
    'semmeln-broetchen': '<ellipse cx="24" cy="27" rx="17" ry="11"/><path d="M15 20c3 4 3 10 0 14M33 20c-3 4-3 10 0 14M24 16v22"/>',
    'kuchen-torten': '<rect x="7" y="27" width="34" height="12" rx="2"/><path d="M7 33h34M24 27v-8M24 11c2.6 2.4 2.6 5.2 0 7.4c-2.6-2.2-2.6-5 0-7.4z"/>',
    'kleingebaeck-kekse': '<circle cx="24" cy="24" r="16"/><circle cx="18" cy="19" r="1.8" fill="currentColor"/><circle cx="29" cy="21" r="1.8" fill="currentColor"/><circle cx="23" cy="30" r="1.8" fill="currentColor"/><circle cx="31" cy="30" r="1.4" fill="currentColor"/><circle cx="16" cy="29" r="1.4" fill="currentColor"/>',
    'herzhaftes': '<path d="M7 13q17-7 34 0L24 43z"/><circle cx="19" cy="20" r="2.6"/><circle cx="29" cy="21" r="2.6"/><circle cx="24" cy="31" r="2.6"/>',
    'grundrezepte': '<path d="M6 24h36c0 10-8 17-18 17S6 34 6 24z"/><path d="M32 6L22 22M28 8l5 3"/>',
    'currys': '<path d="M6 25h32c-1 9-8 14-16 14S7 34 6 25z"/><path d="M38 27l7-5M15 9c-3 3 3 5 0 8M22 9c-3 3 3 5 0 8M29 9c-3 3 3 5 0 8"/>',
    'eintoepfe': '<rect x="10" y="20" width="28" height="19" rx="3"/><path d="M8 24H5M40 24h3M10 20h28M21 16h6M24 16v-3"/><path d="M17 8c-2 2 2 3 0 5M31 8c-2 2 2 3 0 5"/>',
    'suppen': '<path d="M6 24h36c0 10-8 17-18 17S6 34 6 24z"/><path d="M33 6L26 21M14 9c-3 3 3 5 0 8M21 9c-3 3 3 5 0 8"/>',
    'nudeln': '<path d="M12 5v12a6 6 0 0 0 12 0V5M18 5v14M18 23v20"/><path d="M29 34c3-4 6 4 9 0s5 3 7 0M29 41c3-4 6 4 9 0s5 3 7 0"/>',
    'auflaeufe': '<path d="M6 24h36v13a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z"/><path d="M3 28h3M42 28h3M13 17q2-4 4 0M22 14q2-4 4 0M31 17q2-4 4 0"/>',
    'pfannengerichte': '<circle cx="20" cy="26" r="13"/><circle cx="20" cy="26" r="8"/><path d="M33 26h13"/>',
    'salate': '<path d="M9 39C8 19 21 8 40 8c1 20-9 33-31 31z"/><path d="M9 39L28 20M22 27h8M17 33h6"/>',
    'tofu-rezepte': '<path d="M5 22l11-5 11 5-11 5z"/><path d="M5 22v12l11 5 11-5V22M16 27v12"/><path d="M30 13l6-3 6 3-6 3z"/><path d="M30 13v8l6 3 6-3v-8M36 16v8"/>',
    'saucen-dips': '<path d="M20 7h8v7l5 7v18a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V21l5-7z"/><path d="M15 28h18"/>',
    'desserts': '<path d="M14 24a10 10 0 1 1 20 0z"/><path d="M15 24l9 20 9-20"/><path d="M19 30l5 10M29 30l-5 10"/>',
    'snacks': '<path d="M24 8c10 0 16 8 16 18 0 8-7 14-16 14S8 34 8 26C8 16 14 8 24 8z"/><path d="M24 8v32M16 14c-2 6-2 14 0 20M32 14c2 6 2 14 0 20"/>',
    'standard': '<circle cx="24" cy="24" r="15"/><circle cx="24" cy="24" r="8"/>'
  };
  function icon(id) {
    return '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[id] || ICONS.standard) + '</svg>';
  }

  // ---------- Helfer ----------
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  }
  function haupt(id) {
    return DATA.kategorien.filter(function (k) { return k.id === id; })[0];
  }
  function unterLabel(hid, uid) {
    var h = haupt(hid);
    if (!h) return uid;
    var u = h.unter.filter(function (x) { return x.id === uid; })[0];
    return u ? u.label : uid;
  }
  function zahl(n) { return n + (n === 1 ? ' Rezept' : ' Rezepte'); }

  // ---------- Markdown ----------
  function parseFront(text) {
    var m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
    var d = {};
    if (!m) return { daten: d, body: text };
    m[1].split(/\r?\n/).forEach(function (z) {
      var i = z.indexOf(':');
      if (i < 0) return;
      var v = z.slice(i + 1).trim();
      d[z.slice(0, i).trim()] = (v.charAt(0) === '[' && v.slice(-1) === ']')
        ? v.slice(1, -1).split(',').map(function (t) { return t.trim(); }).filter(Boolean)
        : v;
    });
    return { daten: d, body: text.slice(m[0].length) };
  }

  function cells(zeile) {
    return zeile.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) { return c.trim(); });
  }

  function renderMd(md) {
    var lines = md.replace(/\r/g, '').split('\n');
    var out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i], m;
      if (/^\s*$/.test(l)) { i++; continue; }
      if ((m = l.match(/^(#{1,3})\s+(.*)$/))) {
        out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>');
        i++; continue;
      }
      if (/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        var head = cells(l), rows = [];
        i += 2;
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
        var t = '<div class="tabelle"><table><thead><tr>' + head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
        rows.forEach(function (r) { t += '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; });
        out.push(t + '</tbody></table></div>');
        continue;
      }
      if (/^\s*[-*]\s+/.test(l)) {
        var ul = '<ul>';
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { ul += '<li>' + inline(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>'; i++; }
        out.push(ul + '</ul>'); continue;
      }
      if (/^\s*\d+\.\s+/.test(l)) {
        var ol = '<ol>';
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { ol += '<li>' + inline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'; i++; }
        out.push(ol + '</ol>'); continue;
      }
      var p = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,3})\s/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i]) && !/^\s*\|/.test(lines[i])) { p.push(lines[i]); i++; }
      out.push('<p>' + inline(p.join(' ')) + '</p>');
    }
    return out.join('\n');
  }

  // ---------- Listen ----------
  function listeHtml(rezepte) {
    if (!rezepte.length) return '';
    var h = '<ul class="liste">';
    rezepte.forEach(function (r) {
      var hid = r.kategorie.split('/')[0];
      var meta = [unterLabel(hid, r.kategorie.split('/')[1]), r.zeit_gesamt, r.portionen].filter(Boolean).join(' · ');
      h += '<li><a class="zeile" href="#/r/' + esc(r.id) + '"><span class="marke ' + esc(hid) + '"></span><span>' +
        '<h2>' + esc(r.titel) + '</h2>' +
        (r.untertitel ? '<p class="sub">' + esc(r.untertitel) + '</p>' : '') +
        '<div class="meta">' + esc(meta) + '</div></span></a></li>';
    });
    return h + '</ul>';
  }

  function sucheTreffer(q) {
    var teile = q.toLowerCase().split(/\s+/).filter(Boolean);
    return DATA.rezepte.filter(function (r) {
      var hid = r.kategorie.split('/')[0];
      var hay = (r.titel + ' ' + r.untertitel + ' ' + r.tags.join(' ') + ' ' + unterLabel(hid, r.kategorie.split('/')[1])).toLowerCase();
      return teile.every(function (t) { return hay.indexOf(t) >= 0; });
    });
  }

  // ---------- Startseite: nur Kategorien ----------
  function renderStart() {
    var h = '<input class="suche" id="suche" type="search" placeholder="Rezept suchen" aria-label="Rezept suchen">';
    h += '<div id="ergebnis" hidden></div><div id="kacheln">';
    DATA.kategorien.forEach(function (k) {
      h += '<section class="gruppe ' + esc(k.id) + '"><h2><i></i>' + esc(k.label) + '</h2><div class="kacheln">';
      k.unter.forEach(function (u) {
        var n = DATA.rezepte.filter(function (r) { return r.kategorie === k.id + '/' + u.id; }).length;
        h += '<a class="kachel' + (n ? '' : ' noch-leer') + '" href="#/k/' + esc(k.id) + '/' + esc(u.id) + '">' +
          icon(u.id) + '<span class="name">' + esc(u.label) + '</span><span class="zahl">' + (n ? zahl(n) : 'noch leer') + '</span></a>';
      });
      h += '</div></section>';
    });
    h += '</div>';
    app.innerHTML = h;
    anzahl.textContent = zahl(DATA.rezepte.length);
    document.title = 'Rezepte';

    var s = document.getElementById('suche');
    var erg = document.getElementById('ergebnis');
    var kach = document.getElementById('kacheln');
    s.addEventListener('input', function () {
      var q = s.value.trim();
      if (!q) { erg.hidden = true; kach.hidden = false; return; }
      var t = sucheTreffer(q);
      erg.innerHTML = t.length ? listeHtml(t) : '<p class="leer">Kein Rezept gefunden. Versuche einen anderen Suchbegriff.</p>';
      erg.hidden = false; kach.hidden = true;
    });
  }

  // ---------- Kategorie ----------
  function renderKategorie(hid, uid) {
    var h = haupt(hid);
    if (!h) { renderStart(); return; }
    var treffer = DATA.rezepte.filter(function (r) { return r.kategorie === hid + '/' + uid; });
    var out = '<a class="zurueck" href="#/">‹ Alle Kategorien</a>';
    out += '<div class="titelzeile"><div class="pfad"><i class="' + esc(hid) + '"></i>' + esc(h.label) + '</div><h1>' + esc(unterLabel(hid, uid)) + '</h1></div>';
    out += treffer.length ? listeHtml(treffer) : '<p class="leer">In dieser Kategorie ist noch kein Rezept.</p>';
    app.innerHTML = out;
    anzahl.textContent = '';
    document.title = unterLabel(hid, uid) + ' · Rezepte';
    window.scrollTo(0, 0);
  }

  function renderTag(tag) {
    var treffer = DATA.rezepte.filter(function (r) { return r.tags.indexOf(tag) >= 0; });
    var out = '<a class="zurueck" href="#/">‹ Alle Kategorien</a>';
    out += '<div class="titelzeile"><h1>#' + esc(tag) + '</h1></div>';
    out += treffer.length ? listeHtml(treffer) : '<p class="leer">Kein Rezept mit diesem Tag.</p>';
    app.innerHTML = out;
    anzahl.textContent = '';
    document.title = '#' + tag + ' · Rezepte';
    window.scrollTo(0, 0);
  }

  // ---------- Mengen umrechnen ----------
  var BRUCH = { '½': 0.5, '¼': 0.25, '¾': 0.75, '⅓': 1 / 3, '⅔': 2 / 3, '⅛': 0.125 };
  var NUM = '(?:\\d+(?:[.,]\\d+)?\\s?[½¼¾⅓⅔⅛]?|[½¼¾⅓⅔⅛])';
  var MENGE_RE = new RegExp('^(' + NUM + ')(?:(\\s+(?:bis|-|–)\\s+)(' + NUM + '))?(\\s|$)');
  var SINGULAR = { Eier: 'Ei', Bananen: 'Banane', Zwiebeln: 'Zwiebel', Karotten: 'Karotte', 'Möhren': 'Möhre', 'Äpfel': 'Apfel', Eigelbe: 'Eigelb', Knoblauchzehen: 'Knoblauchzehe', Kartoffeln: 'Kartoffel', Tomaten: 'Tomate', Limetten: 'Limette', Zitronen: 'Zitrone', Orangen: 'Orange' };
  var PLURAL = {};
  Object.keys(SINGULAR).forEach(function (k) { PLURAL[SINGULAR[k]] = k; });

  function parseNum(s) {
    var m = s.trim().match(/^(\d+(?:[.,]\d+)?)?\s?([½¼¾⅓⅔⅛])?$/);
    if (!m) return NaN;
    return (m[1] ? parseFloat(m[1].replace(',', '.')) : 0) + (m[2] ? BRUCH[m[2]] : 0);
  }
  function fmt(v) {
    if (v >= 100) return String(Math.round(v / 5) * 5);
    if (v >= 10) return String(Math.round(v));
    var whole = Math.floor(v + 1e-9), frac = v - whole, f = '';
    if (Math.abs(frac - 1 / 3) < 0.05) f = '⅓';
    else if (Math.abs(frac - 2 / 3) < 0.05) f = '⅔';
    else {
      var q = Math.round(frac * 4) / 4;
      if (q >= 1) { whole += 1; q = 0; }
      f = { 0: '', 0.25: '¼', 0.5: '½', 0.75: '¾' }[q];
    }
    if (!whole && !f) f = '¼';
    return (whole ? String(whole) : '') + f;
  }
  function wort(rest, v) {
    var m = rest.match(/^(\s+)([A-ZÄÖÜ][\wäöüß]*)/);
    if (!m) return rest;
    var w = m[2], neu = w;
    if (Math.abs(v - 1) < 0.01 && SINGULAR[w]) neu = SINGULAR[w];
    else if (v > 1.01 && PLURAL[w]) neu = PLURAL[w];
    return m[1] + neu + rest.slice(m[0].length);
  }
  function skaliere(text, f) {
    var m = text.match(MENGE_RE);
    if (!m) return text;
    var rest = text.slice(m[0].length - m[4].length);
    if (/^\s+Pris/.test(rest)) return text;
    var a = parseNum(m[1]) * f;
    var b = m[3] ? parseNum(m[3]) * f : null;
    var out = fmt(a) + (m[3] ? m[2] + fmt(b) : '');
    rest = rest.replace(/ca\.\s*(\d+(?:[.,]\d+)?)/, function (x, n) { return 'ca. ' + fmt(parseFloat(n.replace(',', '.')) * f); });
    return out + wort(rest, b === null ? a : b);
  }
  function applyMenge(n) {
    if (!skal || !n) return;
    var f = n / skal.basis;
    var lis = document.querySelectorAll('#text .zutaten li');
    for (var i = 0; i < lis.length; i++) {
      var o = lis[i].getAttribute('data-orig');
      lis[i].textContent = f === 1 ? o : skaliere(o, f);
    }
    var knoepfe = document.querySelectorAll('[data-menge]');
    for (var j = 0; j < knoepfe.length; j++) {
      knoepfe[j].setAttribute('aria-pressed', String(parseInt(knoepfe[j].getAttribute('data-menge'), 10) === n));
    }
    var felder = document.querySelectorAll('.daten div');
    for (var k = 0; k < felder.length; k++) {
      var dt = felder[k].querySelector('dt'), dd = felder[k].querySelector('dd');
      if (dt && dd && dt.textContent === 'Portionen') dd.textContent = n + (skal.einheit ? ' ' + skal.einheit : '');
    }
  }

  // ---------- Rezept ----------
  function setWake(an) {
    if (!('wakeLock' in navigator)) return Promise.resolve(false);
    if (!an) {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
      return Promise.resolve(false);
    }
    return navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; return true; }, function () { return false; });
  }

  function renderRezept(id) {
    var r = DATA.rezepte.filter(function (x) { return x.id === id; })[0];
    if (!r) { app.innerHTML = '<p class="fehler">Dieses Rezept gibt es nicht (mehr). <a href="#/">Zu den Kategorien</a></p>'; return; }
    app.innerHTML = '<p class="leer">Lade Rezept …</p>';
    fetch(r.pfad).then(function (res) {
      if (!res.ok) throw new Error(res.status);
      return res.text();
    }).then(function (txt) {
      var f = parseFront(txt);
      var d = f.daten;
      var teile = r.kategorie.split('/');
      var hid = teile[0], uid = teile[1];
      var h = '<a class="zurueck" href="#/k/' + esc(hid) + '/' + esc(uid) + '">‹ ' + esc(unterLabel(hid, uid)) + '</a><article class="rezept">';
      h += '<div class="pfad"><i class="' + esc(hid) + '"></i>' + esc((haupt(hid) || { label: hid }).label + ' / ' + unterLabel(hid, uid)) + '</div>';
      h += '<h1>' + esc(d.titel || r.titel) + '</h1>';
      if (d.untertitel) h += '<p class="sub">' + esc(d.untertitel) + '</p>';
      var felder = [['Portionen', d.portionen], ['Aktive Zeit', d.zeit_aktiv], ['Gesamtzeit', d.zeit_gesamt]].filter(function (x) { return x[1]; });
      if (felder.length) h += '<dl class="daten">' + felder.map(function (x) { return '<div><dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd></div>'; }).join('') + '</dl>';
      var hatTags = d.tags && d.tags.length;
      var basis = parseInt(d.portionen, 10) || 0;
      var einheit = (d.portionen || '').replace(/^\s*\d+\s*/, '');
      var optionen = [].concat(d.umrechnen || []).map(Number).filter(function (x) { return x > 0; });
      var mitMenge = basis > 0 && optionen.length > 1;
      if ('wakeLock' in navigator || hatTags || mitMenge) {
        h += '<div class="werkzeuge">';
        if (mitMenge) h += '<span class="mengen" role="group" aria-label="Menge">' + optionen.map(function (n) { return '<button class="chip" type="button" data-menge="' + n + '" aria-pressed="' + (n === basis) + '">' + n + (einheit ? ' ' + esc(einheit) : '') + '</button>'; }).join('') + '</span>';
        if ('wakeLock' in navigator) h += '<button class="chip" id="wake" type="button" aria-pressed="false">Bildschirm anlassen</button>';
        if (hatTags) h += '<span class="tags">' + d.tags.map(function (t) { return '<a class="chip tag" href="#/t/' + encodeURIComponent(t) + '" style="text-decoration:none">' + esc(t) + '</a>'; }).join('') + '</span>';
        h += '</div>';
      }
      h += '<div class="text" id="text">' + renderMd(f.body) + '</div>';
      if (d.quelle) h += '<p class="quelle">Quelle: ' + esc(d.quelle) + '</p>';
      h += '</article>';
      app.innerHTML = h;
      document.title = (d.titel || r.titel) + ' · Rezepte';
      anzahl.textContent = '';
      window.scrollTo(0, 0);

      // Zutaten abhaken
      var text = document.getElementById('text');
      var heads = text.querySelectorAll('h2');
      for (var i = 0; i < heads.length; i++) {
        if (/^zutaten/i.test(heads[i].textContent)) {
          var el = heads[i].nextElementSibling;
          while (el && el.tagName !== 'H2') {
            if (el.tagName === 'UL') el.className = 'zutaten';
            el = el.nextElementSibling;
          }
        }
      }
      skal = mitMenge ? { basis: basis, einheit: einheit } : null;
      Array.prototype.forEach.call(text.querySelectorAll('.zutaten li'), function (li) { li.setAttribute('data-orig', li.textContent); });
      text.addEventListener('click', function (e) {
        var li = e.target.closest ? e.target.closest('.zutaten li') : null;
        if (li) li.classList.toggle('fertig');
      });
    }).catch(function () {
      app.innerHTML = '<p class="fehler">Das Rezept lässt sich gerade nicht laden. Prüfe die Internetverbindung und <a href="#/r/' + esc(id) + '">versuche es erneut</a>.</p>';
    });
  }

  // ---------- Ereignisse ----------
  app.addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.getAttribute && t.getAttribute('data-menge')) { applyMenge(parseInt(t.getAttribute('data-menge'), 10)); return; }
    if (t && t.id === 'wake') {
      var an = t.getAttribute('aria-pressed') !== 'true';
      setWake(an).then(function (ok) {
        t.setAttribute('aria-pressed', String(an && ok));
        t.textContent = (an && ok) ? 'Bildschirm bleibt an' : 'Bildschirm anlassen';
      });
    }
  });
  document.addEventListener('visibilitychange', function () {
    var w = document.getElementById('wake');
    if (document.visibilityState === 'visible' && w && w.getAttribute('aria-pressed') === 'true') setWake(true);
  });

  function route() {
    setWake(false);
    var hash = location.hash, m;
    if ((m = hash.match(/^#\/r\/(.+)$/))) renderRezept(decodeURIComponent(m[1]));
    else if ((m = hash.match(/^#\/k\/([^/]+)\/([^/]+)$/))) renderKategorie(decodeURIComponent(m[1]), decodeURIComponent(m[2]));
    else if ((m = hash.match(/^#\/t\/(.+)$/))) renderTag(decodeURIComponent(m[1]));
    else { renderStart(); window.scrollTo(0, 0); }
  }
  window.addEventListener('hashchange', route);

  fetch('rezepte/index.json', { cache: 'no-cache' }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function (j) { DATA = j; route(); }).catch(function () {
    app.innerHTML = '<p class="fehler">Die Rezeptliste lässt sich nicht laden. Prüfe die Internetverbindung und lade die Seite neu.</p>';
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
  }
})();
</script>
</body>
</html>

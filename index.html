<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rezepte</title>
<meta name="description" content="Unsere Rezeptsammlung: Backen und Kochen.">
<meta name="theme-color" content="#f2f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151b18" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rezepte">
<style>
:root {
  --paper: #f2f4f0;
  --ink: #1e2b27;
  --muted: #5a6962;
  --line: #d5dbd4;
  --chip: #e5eae3;
  --backen: #a8761e;
  --kochen: #2e6f5e;
  --accent: #2b5546;
  --on-accent: #f2f4f0;
  --focus: #1f5fbf;
  --serif: Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151b18;
    --ink: #e7ece8;
    --muted: #9aa8a0;
    --line: #2b3631;
    --chip: #232d28;
    --backen: #d9a54a;
    --kochen: #6fbfa6;
    --accent: #8fd0b9;
    --on-accent: #151b18;
    --focus: #8ab4f8;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 17px/1.55 var(--sans);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

/* Kopf */
.kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: .5rem 0 1rem; }
.kopf h1 { font: 600 2.4rem/1.1 var(--serif); letter-spacing: -.01em; margin: 0; }
.kopf h1 a { text-decoration: none; }
.anzahl { color: var(--muted); font-size: .95rem; }

/* Suche */
.suche { width: 100%; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: .7rem .9rem; margin-bottom: 1rem; }
.suche::placeholder { color: var(--muted); }

/* Hauptkategorien */
.haupt { display: flex; gap: .5rem; margin-bottom: .75rem; }
.haupt button {
  flex: 1; padding: .6rem .5rem; border: 1px solid var(--line); background: transparent;
  border-radius: 10px; cursor: pointer; font-weight: 600;
}
.haupt button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* Chips */
.chips { display: flex; gap: .4rem; overflow-x: auto; padding: .15rem 0 .6rem; margin: 0 -1rem; padding-left: 1rem; padding-right: 1rem; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 0; background: var(--chip); border-radius: 999px;
  padding: .35rem .8rem; font-size: .92rem; cursor: pointer; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chip.tag::before { content: "#"; opacity: .6; margin-right: .1rem; }

/* Liste */
.liste { list-style: none; margin: 1rem 0 0; padding: 0; border-top: 1px solid var(--line); }
.liste li { border-bottom: 1px solid var(--line); }
.zeile {
  display: grid; grid-template-columns: .35rem 1fr; gap: .9rem; text-decoration: none;
  padding: .95rem 0; align-items: stretch;
}
.zeile .marke { border-radius: 2px; background: var(--muted); }
.zeile .marke.backen { background: var(--backen); }
.zeile .marke.kochen { background: var(--kochen); }
.zeile h2 { font: 600 1.3rem/1.25 var(--serif); margin: 0; }
.zeile .sub { color: var(--muted); margin: .1rem 0 0; font-size: .95rem; }
.zeile .meta { color: var(--muted); font-size: .88rem; margin-top: .35rem; }
.leer { color: var(--muted); padding: 2rem 0; }

/* Rezept */
.zurueck { display: inline-block; margin: .25rem 0 1rem; padding: .4rem 0; color: var(--muted); text-decoration: none; }
.zurueck:hover { color: var(--ink); }
.rezept h1 { font: 600 2.1rem/1.15 var(--serif); letter-spacing: -.01em; margin: 0 0 .25rem; }
.rezept .sub { color: var(--muted); font-size: 1.05rem; margin: 0 0 1rem; }
.rezept .pfad { display: flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .92rem; margin-bottom: .6rem; }
.rezept .pfad i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--muted); display: inline-block; }
.rezept .pfad i.backen { background: var(--backen); }
.rezept .pfad i.kochen { background: var(--kochen); }
.daten { display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; margin: 0 0 1rem; padding: .8rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.daten div { min-width: 6rem; }
.daten dt { color: var(--muted); font-size: .85rem; }
.daten dd { margin: 0; font-weight: 600; }
.werkzeuge { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1.25rem; align-items: center; }
.werkzeuge .chip { padding: .5rem .9rem; }
.tags { display: flex; flex-wrap: wrap; gap: .4rem; }

.text h2 { font: 600 1.45rem/1.25 var(--serif); margin: 2rem 0 .6rem; }
.text h3 { font: 600 1.05rem/1.3 var(--sans); margin: 1.2rem 0 .4rem; }
.text p { margin: 0 0 1rem; max-width: 38rem; }
.text ul, .text ol { padding-left: 1.3rem; margin: 0 0 1rem; max-width: 38rem; }
.text li { margin: .4rem 0; padding-left: .2rem; }
.text .zutaten li { list-style: none; margin-left: -1.3rem; padding: .45rem .5rem .45rem 2.2rem; position: relative; cursor: pointer; border-bottom: 1px solid var(--line); }
.text .zutaten li::before {
  content: ""; position: absolute; left: .4rem; top: .75rem; width: 1.05rem; height: 1.05rem;
  border: 2px solid var(--muted); border-radius: 4px;
}
.text .zutaten li.fertig { color: var(--muted); text-decoration: line-through; }
.text .zutaten li.fertig::before { background: var(--accent); border-color: var(--accent); }
.tabelle { overflow-x: auto; margin: 0 0 1.25rem; }
.text table { border-collapse: collapse; width: 100%; font-size: .98rem; }
.text th { text-align: left; font-weight: 600; color: var(--muted); font-size: .88rem; border-bottom: 2px solid var(--line); padding: .45rem .6rem .45rem 0; }
.text td { border-bottom: 1px solid var(--line); padding: .6rem .6rem .6rem 0; vertical-align: top; }
.text td:first-child { font-weight: 600; white-space: nowrap; padding-right: 1rem; }
@media (max-width: 30rem) { .text td:first-child { white-space: normal; min-width: 5.5rem; } }
.fehler { border: 1px solid var(--line); border-radius: 10px; padding: 1rem; }
@media print {
  .zurueck, .werkzeuge, .tags { display: none; }
  body { background: #fff; color: #000; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="kopf">
    <h1><a href="#/">Rezepte</a></h1>
    <span class="anzahl" id="anzahl"></span>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<noscript><p class="wrap">Diese Seite braucht JavaScript.</p></noscript>

<script>
(function () {
  'use strict';

  var app = document.getElementById('app');
  var anzahl = document.getElementById('anzahl');
  var DATA = null;
  var filter = { haupt: '', unter: '', tag: '', q: '' };
  var wakeLock = null;

  // ---------- Helfer ----------
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  }
  function labelFor(katId) {
    var p = katId.split('/');
    for (var i = 0; i < DATA.kategorien.length; i++) {
      var h = DATA.kategorien[i];
      if (h.id === p[0]) {
        for (var j = 0; j < h.unter.length; j++) {
          if (h.unter[j].id === p[1]) return h.label + ' · ' + h.unter[j].label;
        }
        return h.label;
      }
    }
    return katId;
  }

  // ---------- Markdown ----------
  function parseFront(text) {
    var m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
    var d = {};
    if (!m) return { daten: d, body: text };
    m[1].split(/\r?\n/).forEach(function (z) {
      var i = z.indexOf(':');
      if (i < 0) return;
      var v = z.slice(i + 1).trim();
      d[z.slice(0, i).trim()] = (v.charAt(0) === '[' && v.slice(-1) === ']')
        ? v.slice(1, -1).split(',').map(function (t) { return t.trim(); }).filter(Boolean)
        : v;
    });
    return { daten: d, body: text.slice(m[0].length) };
  }

  function cells(zeile) {
    return zeile.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) { return c.trim(); });
  }

  function renderMd(md) {
    var lines = md.replace(/\r/g, '').split('\n');
    var out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i], m;
      if (/^\s*$/.test(l)) { i++; continue; }
      if ((m = l.match(/^(#{1,3})\s+(.*)$/))) {
        out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>');
        i++; continue;
      }
      if (/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        var head = cells(l), rows = [];
        i += 2;
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
        var t = '<div class="tabelle"><table><thead><tr>' + head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
        rows.forEach(function (r) { t += '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; });
        out.push(t + '</tbody></table></div>');
        continue;
      }
      if (/^\s*[-*]\s+/.test(l)) {
        var ul = '<ul>';
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { ul += '<li>' + inline(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>'; i++; }
        out.push(ul + '</ul>'); continue;
      }
      if (/^\s*\d+\.\s+/.test(l)) {
        var ol = '<ol>';
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { ol += '<li>' + inline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'; i++; }
        out.push(ol + '</ol>'); continue;
      }
      var p = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,3})\s/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i]) && !/^\s*\|/.test(lines[i])) { p.push(lines[i]); i++; }
      out.push('<p>' + inline(p.join(' ')) + '</p>');
    }
    return out.join('\n');
  }

  // ---------- Liste ----------
  function passt(r) {
    var haupt = r.kategorie.split('/')[0];
    if (filter.haupt && haupt !== filter.haupt) return false;
    if (filter.unter && r.kategorie !== filter.haupt + '/' + filter.unter) return false;
    if (filter.tag && r.tags.indexOf(filter.tag) < 0) return false;
    if (filter.q) {
      var hay = (r.titel + ' ' + r.untertitel + ' ' + r.tags.join(' ') + ' ' + labelFor(r.kategorie)).toLowerCase();
      var teile = filter.q.toLowerCase().split(/\s+/);
      for (var k = 0; k < teile.length; k++) if (hay.indexOf(teile[k]) < 0) return false;
    }
    return true;
  }

  function renderListe() {
    var alle = DATA.rezepte;
    var treffer = alle.filter(passt);
    var h = '<input class="suche" id="suche" type="search" placeholder="Rezept suchen" aria-label="Rezept suchen" value="' + esc(filter.q) + '">';

    h += '<div class="haupt" role="group" aria-label="Bereich">';
    h += '<button type="button" data-haupt="" aria-pressed="' + (!filter.haupt) + '">Alle</button>';
    DATA.kategorien.forEach(function (k) {
      h += '<button type="button" data-haupt="' + esc(k.id) + '" aria-pressed="' + (filter.haupt === k.id) + '">' + esc(k.label) + '</button>';
    });
    h += '</div>';

    if (filter.haupt) {
      var hk = DATA.kategorien.filter(function (k) { return k.id === filter.haupt; })[0];
      var vorhanden = hk.unter.filter(function (u) {
        return alle.some(function (r) { return r.kategorie === hk.id + '/' + u.id; });
      });
      if (vorhanden.length) {
        h += '<div class="chips" role="group" aria-label="Kategorie">';
        h += '<button class="chip" type="button" data-unter="" aria-pressed="' + (!filter.unter) + '">Alle</button>';
        vorhanden.forEach(function (u) {
          h += '<button class="chip" type="button" data-unter="' + esc(u.id) + '" aria-pressed="' + (filter.unter === u.id) + '">' + esc(u.label) + '</button>';
        });
        h += '</div>';
      }
    }

    var tags = {};
    alle.forEach(function (r) {
      if (filter.haupt && r.kategorie.split('/')[0] !== filter.haupt) return;
      r.tags.forEach(function (t) { tags[t] = (tags[t] || 0) + 1; });
    });
    var tagListe = Object.keys(tags).sort();
    if (tagListe.length) {
      h += '<div class="chips" role="group" aria-label="Tags">';
      tagListe.forEach(function (t) {
        h += '<button class="chip tag" type="button" data-tag="' + esc(t) + '" aria-pressed="' + (filter.tag === t) + '">' + esc(t) + '</button>';
      });
      h += '</div>';
    }

    if (!treffer.length) {
      h += '<p class="leer">Kein Rezept gefunden. Ändere die Suche oder entferne einen Filter.</p>';
    } else {
      h += '<ul class="liste">';
      treffer.forEach(function (r) {
        var meta = [labelFor(r.kategorie).split(' · ')[1] || '', r.zeit_gesamt, r.portionen].filter(Boolean).join(' · ');
        h += '<li><a class="zeile" href="#/r/' + esc(r.id) + '"><span class="marke ' + esc(r.kategorie.split('/')[0]) + '"></span><span>' +
          '<h2>' + esc(r.titel) + '</h2>' +
          (r.untertitel ? '<p class="sub">' + esc(r.untertitel) + '</p>' : '') +
          '<div class="meta">' + esc(meta) + '</div></span></a></li>';
      });
      h += '</ul>';
    }
    app.innerHTML = h;
    anzahl.textContent = treffer.length + (treffer.length === 1 ? ' Rezept' : ' Rezepte');
    document.title = 'Rezepte';

    var s = document.getElementById('suche');
    s.addEventListener('input', function () {
      filter.q = s.value;
      var pos = s.selectionStart;
      renderListe();
      var n = document.getElementById('suche');
      n.focus();
      try { n.setSelectionRange(pos, pos); } catch (e) {}
    });
  }

  // ---------- Rezept ----------
  function setWake(an) {
    if (!('wakeLock' in navigator)) return Promise.resolve(false);
    if (!an) {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
      return Promise.resolve(false);
    }
    return navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; return true; }, function () { return false; });
  }

  function renderRezept(id) {
    var r = DATA.rezepte.filter(function (x) { return x.id === id; })[0];
    if (!r) { app.innerHTML = '<p class="fehler">Dieses Rezept gibt es nicht (mehr). <a href="#/">Zur Übersicht</a></p>'; return; }
    app.innerHTML = '<p class="leer">Lade Rezept …</p>';
    fetch(r.pfad).then(function (res) {
      if (!res.ok) throw new Error(res.status);
      return res.text();
    }).then(function (txt) {
      var f = parseFront(txt);
      var d = f.daten;
      var haupt = r.kategorie.split('/')[0];
      var h = '<a class="zurueck" href="#/">‹ Alle Rezepte</a><article class="rezept">';
      h += '<div class="pfad"><i class="' + esc(haupt) + '"></i>' + esc(labelFor(r.kategorie).replace(' · ', ' / ')) + '</div>';
      h += '<h1>' + esc(d.titel || r.titel) + '</h1>';
      if (d.untertitel) h += '<p class="sub">' + esc(d.untertitel) + '</p>';
      var felder = [['Portionen', d.portionen], ['Aktive Zeit', d.zeit_aktiv], ['Gesamtzeit', d.zeit_gesamt]].filter(function (x) { return x[1]; });
      if (felder.length) h += '<dl class="daten">' + felder.map(function (x) { return '<div><dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd></div>'; }).join('') + '</dl>';
      h += '<div class="werkzeuge">';
      if ('wakeLock' in navigator) h += '<button class="chip" id="wake" type="button" aria-pressed="false">Bildschirm anlassen</button>';
      if (d.tags && d.tags.length) h += '<span class="tags">' + d.tags.map(function (t) { return '<button class="chip tag" type="button" data-tagsprung="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') + '</span>';
      h += '</div>';
      h += '<div class="text" id="text">' + renderMd(f.body) + '</div></article>';
      app.innerHTML = h;
      document.title = (d.titel || r.titel) + ' · Rezepte';
      anzahl.textContent = '';
      window.scrollTo(0, 0);

      // Zutaten abhaken
      var text = document.getElementById('text');
      var heads = text.querySelectorAll('h2');
      for (var i = 0; i < heads.length; i++) {
        if (/^zutaten/i.test(heads[i].textContent)) {
          var el = heads[i].nextElementSibling;
          while (el && el.tagName !== 'H2') {
            if (el.tagName === 'UL') el.className = 'zutaten';
            el = el.nextElementSibling;
          }
        }
      }
      text.addEventListener('click', function (e) {
        var li = e.target.closest ? e.target.closest('.zutaten li') : null;
        if (li) li.classList.toggle('fertig');
      });
    }).catch(function () {
      app.innerHTML = '<p class="fehler">Das Rezept lässt sich gerade nicht laden. Prüfe die Internetverbindung und <a href="#/r/' + esc(id) + '">versuche es erneut</a>.</p>';
    });
  }

  // ---------- Ereignisse ----------
  app.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.getAttribute) return;
    if (t.hasAttribute('data-haupt')) { filter.haupt = t.getAttribute('data-haupt'); filter.unter = ''; renderListe(); }
    else if (t.hasAttribute('data-unter')) { filter.unter = t.getAttribute('data-unter'); renderListe(); }
    else if (t.hasAttribute('data-tag')) { var v = t.getAttribute('data-tag'); filter.tag = filter.tag === v ? '' : v; renderListe(); }
    else if (t.hasAttribute('data-tagsprung')) { filter = { haupt: '', unter: '', tag: t.getAttribute('data-tagsprung'), q: '' }; location.hash = '#/'; }
    else if (t.id === 'wake') {
      var an = t.getAttribute('aria-pressed') !== 'true';
      setWake(an).then(function (ok) {
        t.setAttribute('aria-pressed', String(an && ok));
        t.textContent = (an && ok) ? 'Bildschirm bleibt an' : 'Bildschirm anlassen';
      });
    }
  });
  document.addEventListener('visibilitychange', function () {
    var w = document.getElementById('wake');
    if (document.visibilityState === 'visible' && w && w.getAttribute('aria-pressed') === 'true') setWake(true);
  });

  function route() {
    setWake(false);
    var m = location.hash.match(/^#\/r\/(.+)$/);
    if (m) renderRezept(decodeURIComponent(m[1])); else renderListe();
  }
  window.addEventListener('hashchange', route);

  fetch('rezepte/index.json', { cache: 'no-cache' }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function (j) { DATA = j; route(); }).catch(function () {
    app.innerHTML = '<p class="fehler">Die Rezeptliste lässt sich nicht laden. Prüfe die Internetverbindung und lade die Seite neu.</p>';
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
  }
})();
</script>
</body>
</html>
